database:
  host: ${PROD_DB_HOST}
  port: ${PROD_DB_PORT}
  user: ${PROD_DB_USERNAME}
  password: ${PROD_DB_PASSWORD}
  # NOT ${PROD_DB_DATABASE} (2026-09-24) -- that var is title_matching/
  # prod_db.py's schema (mqproduction, where fq_movie_master lives), shared
  # from the same amenity/prod-db-credentials secret. movies_shows itself
  # lives in a different schema on the same prod host (moviemeasure, same
  # name as dev's DEV_DB_DATABASE) -- pointing dqscan at PROD_DB_DATABASE
  # silently queried the wrong schema and returned "no data found". This is
  # dqscan's own var so fixing it can never affect the Movie Master sync.
  schema: ${DQSCAN_PROD_DB_DATABASE}
scan:
  window_column: date_sh
  detail_row_cap: 500
  calibration_threshold: 0.20
  include_calibration: true
  include_dormant: false
  # Raised from 60 to 180 (2026-09-24) -- prod movies_shows is ~596M rows
  # (dev is far smaller), and a full today-through-latest-date_sh run there
  # timed out 34 of 72 rules at 60s. Investigated directly: indexes on
  # date_sh/mm_id/etc. already exist and EXPLAIN plans are reasonable (no
  # missing-index or runaway-query problem); timed 3 representative failing
  # queries uncapped and all three landed in the 37-73s range with no DB
  # contention from anything else running. This is a timeout-budget problem,
  # not a query problem.
  # Raised again to 300 (2026-09-25, per request) -- a real run at 180s
  # still hit it on a few rules (XROW_MM_ID_IDENTITY, XROW_DUPLICATE_SHOWTIME,
  # measured at 72.6s in isolation but pushed over 180s by real contention
  # from 6-way parallelism). This is per-query, not the overall run --
  # dqscan_task.py's separate outer subprocess timeout was removed entirely
  # on 2026-09-25 (see that file's history), so this is now the only
  # timeout in play besides the socket-level read_timeout backstop
  # (query_timeout_seconds + 15, see dqscan/engine.py).
  query_timeout_seconds: 300
  # 6 rules/batches run concurrently against the DB (2026-09-24, per
  # request) -- db.get_engine's connection pool is sized to match this
  # exactly (see dqscan/engine.py), so raising this without also touching
  # that pool sizing would just queue extra work items behind a pool that's
  # too small for them.
  parallel_workers: 6
email:
  enabled: false
  # reports@enttelligence.com is not yet a verified SES sender identity (nor
  # is the enttelligence.com domain) -- sends would fail with MessageRejected
  # until either the domain or this exact address is verified in SES. See
  # dqscan/emailer.py. Switched off in favor of sns below.
  sender: reports@enttelligence.com
  recipients:
    - souveek.pradhan@enttelligence.com
  aws_region: us-east-1
sns:
  enabled: true
  # A SEPARATE topic from config.yaml's dev one -- prod subscribers must
  # never see dev-run test noise, and vice versa.
  topic_arn: arn:aws:sns:us-east-1:690602674396:dqscan-reports-prod
  s3_bucket: erica-datastore
  s3_prefix: dqscan-reports-prod
  aws_region: us-east-1
