version: 1
table: movies_shows
row_id: id
grain: [mm_id, running_date]
window_column: date_sh

allowlist_regex: "^[[:alnum:] &''.,/#():+|-]*$"
ca_provinces: [AB, BC, MB, NB, NL, NS, NT, NU, ON, PE, QC, SK, YT]

rules:

- id: PRES_MM_ID
  name: mm_id null or blank
  class: presence
  severity: critical
  status: active
  requires: [mm_id]
  expr: "mm_id IS NULL OR mm_id = ''"
  detail_columns: [mm_id]
  message: "showtime identifier missing"

- id: PRES_LAST_UPDATES
  name: last_updates null
  class: presence
  severity: critical
  status: active
  requires: [last_updates]
  expr: "last_updates IS NULL"
  detail_columns: [last_updates, running_date]
  message: "row has no update timestamp, invisible to a delta scan"

- id: PRES_DATE_SH
  name: date_sh null or zero date
  class: presence
  severity: critical
  status: active
  requires: [date_sh]
  expr: "date_sh IS NULL OR CAST(date_sh AS CHAR) IN ('0000-00-00', '')"
  detail_columns: [date_sh]
  message: "showtime date missing or zero"

- id: PRES_TIME_SH
  name: time_sh null or blank
  class: presence
  severity: critical
  status: active
  requires: [time_sh]
  expr: "time_sh IS NULL OR time_sh = ''"
  detail_columns: [time_sh]
  message: "showtime time missing"

- id: PRES_TITLE
  name: title null or blank
  class: presence
  severity: critical
  status: active
  requires: [title]
  expr: "title IS NULL OR TRIM(title) = ''"
  detail_columns: [title]
  message: "film title missing"

- id: PRES_THEATER_ID
  name: theater_id null or blank
  class: presence
  severity: critical
  status: active
  requires: [theater_id]
  expr: "theater_id IS NULL OR theater_id = ''"
  detail_columns: [theater_id, theater_name]
  message: "theater identifier missing"

- id: PRES_CIRCUIT
  name: circuit_name blank
  class: presence
  severity: medium
  status: active
  requires: [circuit_name]
  expr: "circuit_name IS NULL OR TRIM(circuit_name) = ''"
  detail_columns: [circuit_name, theater_name]
  message: "circuit missing"

- id: PRES_COUNTRY
  name: country blank
  class: presence
  severity: medium
  status: active
  requires: [country]
  expr: "country IS NULL OR TRIM(country) = ''"
  detail_columns: [country, theater_state]
  message: "country missing"

- id: PRES_THEATER_NAME
  name: theater_name blank
  class: presence
  severity: medium
  status: active
  requires: [theater_name]
  expr: "theater_name IS NULL OR TRIM(theater_name) = ''"
  detail_columns: [theater_id, theater_name]
  message: "theater name missing"

- id: PRES_AUDITORIUM
  name: theater stopped reporting auditorium
  class: custom
  severity: medium
  status: active
  requires: [theater_name, auditorium, running_date, date_sh]
  detail_columns: [theater_name]
  message: "theater had auditorium data before but is missing it today"
  note: >
    Replaced 2026-09-17 (query from Aarti) -- the old check (any blank
    auditorium) fired constantly for theaters (e.g. AMC) that never report
    auditorium at all, which isn't a defect. This instead only flags a
    theater that USED to report auditorium and has now stopped -- a real
    regression. Deliberately always uses CURRENT_DATE(), not this run's
    --from/--to window, so: (1) the report's %-of-window column isn't
    meaningful for this rule, (2) a retrospective/backfill run still checks
    against right-now, not the range being scanned, and (3) this resurfaces
    the same standing violations on every daily run rather than only new
    ones. All intentional, matching the query as given. Also treats the
    literal text 'NULL' as not-reporting (2026-09-17) -- 50 rows in a dev
    sample had auditorium stored as the 4-character string NULL, which the
    old TRIM<>'' check let through as if the theater were reporting fine.
  sql: |
    SELECT theater_name
    FROM (
        SELECT
            theater_name,
            MAX(CASE WHEN running_date < CURRENT_DATE()
                      AND auditorium IS NOT NULL
                      AND TRIM(auditorium) <> ''
                      AND UPPER(TRIM(auditorium)) <> 'NULL'
                     THEN 1 ELSE 0 END) AS had_auditorium_before,
            MAX(CASE WHEN running_date = CURRENT_DATE() THEN 1 ELSE 0 END) AS has_row_today,
            MAX(CASE WHEN running_date = CURRENT_DATE()
                      AND auditorium IS NOT NULL
                      AND TRIM(auditorium) <> ''
                      AND UPPER(TRIM(auditorium)) <> 'NULL'
                     THEN 1 ELSE 0 END) AS has_auditorium_today
        FROM {{table}}
        WHERE date_sh >= CURRENT_DATE() - INTERVAL 1 DAY
          AND running_date <= CURRENT_DATE()
        GROUP BY theater_name
    ) x
    WHERE had_auditorium_before = 1
      AND has_row_today = 1
      AND has_auditorium_today = 0
    ORDER BY theater_name

- id: FMT_RUNNING_DATE
  name: running_date not equal to date of last_updates
  class: cross_column
  severity: high
  status: active
  requires: [running_date, last_updates]
  expr: "last_updates IS NOT NULL AND running_date <> DATE(last_updates)"
  detail_columns: [running_date, last_updates]
  message: "crawl date does not match the update timestamp it should be derived from"

- id: FMT_MM_ID
  name: mm_id not 24-char hex
  class: format
  severity: high
  status: active
  requires: [mm_id]
  expr: "mm_id IS NOT NULL AND mm_id <> '' AND NOT REGEXP_LIKE(mm_id, '^[0-9a-f]{24}$')"
  detail_columns: [mm_id]
  message: "showtime identifier is not a 24-character hex value"

- id: FMT_TIME_SH
  name: time_sh not 24-hour HH:MM
  class: format
  severity: high
  status: active
  requires: [time_sh]
  expr: "time_sh IS NOT NULL AND time_sh <> '' AND NOT REGEXP_LIKE(CAST(time_sh AS CHAR), '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$')"
  detail_columns: [time_sh]
  message: "showtime time is not 24-hour HH:MM"

- id: FMT_PRICE_DECIMALS
  name: price has more than 2 decimal places
  class: format
  severity: critical
  status: active
  requires: [price]
  expr: "price IS NOT NULL AND price <> '' AND NOT REGEXP_LIKE(REPLACE(price, '$', ''), '^[0-9]+([.][0-9]{1,2})?$')"
  detail_columns: [price]
  message: "price has more than 2 decimal places"
  note: "Merged 2026-09-17: was two rules (exactly-2-required, blocked by Q10; and 3+-decimal noise). Resolves Q10 -- up to 2 decimals is valid (e.g. $7, $7.0, $7.00), only 3+ decimals (e.g. $16.490000000000002) is a defect."

- id: FMT_CHILD_DECIMALS
  name: child price has more than 2 decimal places
  class: format
  severity: critical
  status: active
  requires: [child]
  expr: "child IS NOT NULL AND child <> '' AND NOT REGEXP_LIKE(REPLACE(child, '$', ''), '^[0-9]+([.][0-9]{1,2})?$')"
  detail_columns: [child, price]
  message: "child price has more than 2 decimal places"
  note: "Merged 2026-09-17, same relaxation as FMT_PRICE_DECIMALS."

- id: FMT_SENIOR_DECIMALS
  name: senior price has more than 2 decimal places
  class: format
  severity: critical
  status: active
  requires: [senior]
  expr: "senior IS NOT NULL AND senior <> '' AND NOT REGEXP_LIKE(REPLACE(senior, '$', ''), '^[0-9]+([.][0-9]{1,2})?$')"
  detail_columns: [senior, price]
  message: "senior price has more than 2 decimal places"
  note: "Merged 2026-09-17, same relaxation as FMT_PRICE_DECIMALS."

- id: FMT_PRICE_SYMBOL
  name: price uses a non-dollar symbol
  class: format
  severity: medium
  status: active
  requires: [price]
  expr: "price IS NOT NULL AND price <> '' AND NOT REGEXP_LIKE(price, '^[$]?[0-9]')"
  detail_columns: [price]
  message: "price is not in dollar format"
  note: "Added 2026-09-17. 0% finding rate in dev data as of this date -- every populated price/child/senior value currently starts with $ (or is the already-caught literal string 'NULL', see FMT_PRICE_DECIMALS). Added as forward-looking coverage per request, not an evidenced live defect."

- id: FMT_CHILD_SYMBOL
  name: child price uses a non-dollar symbol
  class: format
  severity: medium
  status: active
  requires: [child]
  expr: "child IS NOT NULL AND child <> '' AND NOT REGEXP_LIKE(child, '^[$]?[0-9]')"
  detail_columns: [child, price]
  message: "child price is not in dollar format"
  note: "Added 2026-09-17, same rationale as FMT_PRICE_SYMBOL."

- id: FMT_SENIOR_SYMBOL
  name: senior price uses a non-dollar symbol
  class: format
  severity: medium
  status: active
  requires: [senior]
  expr: "senior IS NOT NULL AND senior <> '' AND NOT REGEXP_LIKE(senior, '^[$]?[0-9]')"
  detail_columns: [senior, price]
  message: "senior price is not in dollar format"
  note: "Added 2026-09-17, same rationale as FMT_PRICE_SYMBOL."

- id: FMT_ZIP_US
  name: US row with invalid zip
  class: format
  severity: high
  status: active
  requires: [theater_zip, country]
  expr: "country = 'USA' AND NOT REGEXP_LIKE(theater_zip, '^[0-9]{5}(-[0-9]{4})?$')"
  detail_columns: [theater_zip, theater_city, theater_state, country]
  message: "US postal code is not 5 digits or ZIP+4"
  note: "theater_zip must stay a text column. Ten sample zips have a leading zero."

- id: FMT_ZIP_CA
  name: Canada row with invalid postal code
  class: format
  severity: high
  status: active
  requires: [theater_zip, country]
  expr: "country = 'Canada' AND NOT REGEXP_LIKE(UPPER(theater_zip), '^[A-Z][0-9][A-Z] ?[0-9][A-Z][0-9]$')"
  detail_columns: [theater_zip, theater_city, theater_state, country]
  message: "Canadian postal code is not in A1A 1A1 form"
  note: "Sample had a truncated value, K7R, at Bouler House Cinema."

- id: JUNK_WHITESPACE
  name: leading or trailing whitespace in a text column
  class: format
  severity: low
  status: active
  requires: [circuit_name, theater_name, theater_address, theater_city, theater_state, theater_zip, title, dma, studio_name, auditorium]
  expr: >
    circuit_name <> TRIM(circuit_name) OR theater_name <> TRIM(theater_name)
    OR theater_address <> TRIM(theater_address) OR theater_city <> TRIM(theater_city)
    OR theater_state <> TRIM(theater_state) OR theater_zip <> TRIM(theater_zip)
    OR title <> TRIM(title) OR dma <> TRIM(dma) OR studio_name <> TRIM(studio_name)
    OR auditorium <> TRIM(auditorium)
  detail_columns: [theater_name, theater_address, title]
  message: "text column has leading or trailing whitespace"
  note: "amenities excluded 2026-09-19 per request."

- id: JUNK_DOUBLE_SPACE
  name: doubled internal space
  class: format
  severity: low
  status: dormant
  requires: [theater_address, theater_name, title]
  expr: "theater_address LIKE '%  %' OR theater_name LIKE '%  %' OR title LIKE '%  %'"
  detail_columns: [theater_name, theater_address, title]
  message: "doubled internal space"
  note: "Disabled 2026-09-19 per request."

- id: JUNK_CHARS_THEATER_NAME
  name: character outside allowlist in theater_name
  class: format
  severity: medium
  status: active
  requires: [theater_name]
  allowlist_regex: "^[[:alnum:] &''.,/#():+|!–—-]*$"
  expr: "NOT REGEXP_LIKE(theater_name, '{{allowlist_regex}}')"
  detail_columns: [theater_name]
  message: "theater name contains a character outside the allowlist"
  note: "Own allowlist (not the pack default) -- additionally allows ! and en/em dash (2026-09-17)."

- id: JUNK_CHARS_ADDRESS
  name: character outside allowlist in theater_address
  class: format
  severity: medium
  status: active
  requires: [theater_address]
  expr: "NOT REGEXP_LIKE(theater_address, '{{allowlist_regex}}')"
  detail_columns: [theater_address]
  message: "address contains a character outside the allowlist"

- id: JUNK_CHARS_TITLE
  name: character outside allowlist in title
  class: format
  severity: medium
  status: active
  requires: [title]
  allowlist_regex: "^[[:alnum:] &''.,/#():+|!@-]*$"
  expr: "NOT REGEXP_LIKE(title, '{{allowlist_regex}}')"
  detail_columns: [title]
  message: "title contains a character outside the allowlist"
  note: "Own allowlist (not the pack default) -- additionally allows @ (2026-09-17) and ! (2026-09-17, titles like 'Six: The Musical Live!')."

- id: DOM_TICKET_AVAILABILITY
  name: ticket_availability outside known set
  class: domain
  severity: high
  status: active
  requires: [ticket_availability]
  allowed: [available, soldout, disabled, Crawdads]
