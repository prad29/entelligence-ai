  class: cross_column
  severity: medium
  status: active
  requires: [seating_type, amenities]
  expr: "(seating_type = 'Reserved' AND LOWER(amenities) LIKE '%non reserved%') OR (seating_type = 'Non Reserved' AND LOWER(amenities) LIKE '%reserved seating%')"
  detail_columns: [seating_type, amenities]
  message: "seating type contradicts the amenities text"
  note: "amenities_new -> amenities (2026-09-17): amenities_new is 100% empty in dev data; amenities is the real column."

- id: XCOL_SHOW_BEFORE_RELEASE
  name: show date before release date
  class: cross_table
  severity: high
  status: active
  requires: [mm_id, date_sh, running_date, theater_id, title, release_date]
  detail_columns: [mm_id, date_sh, running_date, theater_id, title, ms_release_date, master_release_date]
  message: "showtime scheduled before the film's release date"
  note: >
    Rewritten 2026-09-21 per request -- the old version trusted
    movies_shows.release_date directly, which is the crawled value, not the
    verified one. This instead joins mqproduction.fq_movie_master (same
    ms.title = fm.movie_title join as XTAB_MOVIE_MASTER) for release_date,
    restricted to master rows with no linked_movie_id (fm.linked_movie_id
    IS NULL OR blank), and only flags a showtime at least 2 days before
    that release date (DATE_SUB(fm.release_date, INTERVAL 2 DAY) --
    deliberately more lenient than a plain "<", per the source query).
    Deliberately scoped to CURRENT_DATE() - INTERVAL 1 DAY (yesterday and
    today only), not the run's --from/--to window, matching the source
    query exactly -- same CURRENT_DATE()-based convention as PRES_AUDITORIUM.
    The source query was `SELECT * ... GROUP BY ms.mm_id`; rewritten here
    with an explicit column list and MAX() around every non-grouped column
    instead, to dedup to one row per mm_id without relying on MySQL running
    with ONLY_FULL_GROUP_BY relaxed (the same class of portability issue
    that broke XROW_DUP_MMID_NO_AUDITORIUM's window-function DISTINCT) --
    no change in which rows get flagged.
  sql: |
    SELECT mm_id,
           MAX(date_sh) AS date_sh,
           MAX(running_date) AS running_date,
           MAX(theater_id) AS theater_id,
           MAX(title) AS title,
           MAX(ms_release_date) AS ms_release_date,
           MAX(master_release_date) AS master_release_date
    FROM (
      SELECT ms.mm_id, ms.date_sh, ms.running_date, ms.theater_id, ms.title,
             ms.release_date AS ms_release_date, fm.release_date AS master_release_date
      FROM {{table}} ms
      JOIN mqproduction.fq_movie_master fm ON ms.title = fm.movie_title
      WHERE (fm.linked_movie_id IS NULL OR TRIM(fm.linked_movie_id) = '')
        AND ms.date_sh <= DATE_SUB(fm.release_date, INTERVAL 2 DAY)
        AND ms.date_sh >= CURRENT_DATE() - INTERVAL 1 DAY
    ) x
    GROUP BY mm_id
    ORDER BY title

