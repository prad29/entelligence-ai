- id: XROW_WRONG_AVAILABLE
  name: available delta does not reconcile against the previous crawl
  class: custom
  severity: critical
  status: active
  requires: [mm_id, running_date, available, actual_available, ticket_availability, total_seats]
  detail_columns: [mm_id, running_date, available, actual_available]
  message: "seat change does not match the movement in the absolute count"
  note: >
    Reconciled on 100% of comparable sample rows. The single strongest check in
    the pack. Deliberately has no `id` column reference -- prod's movies_shows
    has no id column at all (dev's does); the ORDER BY tiebreak isn't load-
    bearing since rules.yaml's own grain declaration ([mm_id, running_date])
    already guarantees at most one row per partition value.
  sql: |
    SELECT mm_id, running_date, available, actual_available, prev_actual_available
    FROM (
      SELECT mm_id, running_date, available, actual_available,
             LAG(actual_available) OVER (PARTITION BY mm_id ORDER BY running_date) AS prev_actual_available
      FROM {{table}}
      WHERE {{window}} AND ticket_availability <> 'Crawdads' AND total_seats IS NOT NULL
    ) w
    WHERE prev_actual_available IS NOT NULL
      AND available <> actual_available - prev_actual_available

- id: XROW_WRONG_RESERVED
  name: reserved delta does not reconcile against the previous crawl
  class: custom
  severity: critical
  status: active
  requires: [mm_id, running_date, reserved, actual_reserved, ticket_availability, total_seats]
  detail_columns: [mm_id, running_date, reserved, actual_reserved]
  message: "reserved change does not match the movement in the absolute count"
  note: >
    Added 2026-09-17, mirrors XROW_WRONG_AVAILABLE's reconciliation check
    for the reserved/actual_reserved pair instead of available/
    actual_available. Same no-`id`-column rationale applies.
  sql: |
    SELECT mm_id, running_date, reserved, actual_reserved, prev_actual_reserved
    FROM (
      SELECT mm_id, running_date, reserved, actual_reserved,
             LAG(actual_reserved) OVER (PARTITION BY mm_id ORDER BY running_date) AS prev_actual_reserved
      FROM {{table}}
      WHERE {{window}} AND ticket_availability <> 'Crawdads' AND total_seats IS NOT NULL
    ) w
    WHERE prev_actual_reserved IS NOT NULL
      AND reserved <> actual_reserved - prev_actual_reserved

- id: XROW_WRONG_CHECKERED
  name: checkered delta does not reconcile against the previous crawl
  class: custom
  severity: critical
  status: active
  requires: [mm_id, running_date, checkered, actual_checkered, ticket_availability, total_seats]
  detail_columns: [mm_id, running_date, checkered, actual_checkered]
  message: "checkered change does not match the movement in the absolute count"
  note: >
    Added 2026-09-17, mirrors XROW_WRONG_AVAILABLE/XROW_WRONG_RESERVED's
    reconciliation check for the checkered/actual_checkered pair. Same
    no-`id`-column rationale applies.
  sql: |
    SELECT mm_id, running_date, checkered, actual_checkered, prev_actual_checkered
    FROM (
      SELECT mm_id, running_date, checkered, actual_checkered,
             LAG(actual_checkered) OVER (PARTITION BY mm_id ORDER BY running_date) AS prev_actual_checkered
      FROM {{table}}
      WHERE {{window}} AND ticket_availability <> 'Crawdads' AND total_seats IS NOT NULL
    ) w
    WHERE prev_actual_checkered IS NOT NULL
      AND checkered <> actual_checkered - prev_actual_checkered

- id: XROW_WRONG_TOTAL_SEATS
  name: total_seats delta does not reconcile against the previous crawl
  class: custom
  severity: critical
  status: active
  requires: [mm_id, running_date, total_seats, actual_total_seats, ticket_availability]
  detail_columns: [mm_id, running_date, total_seats, actual_total_seats]
  message: "capacity change does not match the movement in the absolute count"
  note: >
    Added 2026-09-17, mirrors XROW_WRONG_AVAILABLE/RESERVED/CHECKERED's
    reconciliation check for the total_seats/actual_total_seats pair -- the
    fourth member of the same family. Measured 35 of 373,542 comparable rows
    (0.0094%) on a dev sample day.
  sql: |
    SELECT mm_id, running_date, total_seats, actual_total_seats, prev_actual_total_seats
    FROM (
      SELECT mm_id, running_date, total_seats, actual_total_seats,
             LAG(actual_total_seats) OVER (PARTITION BY mm_id ORDER BY running_date) AS prev_actual_total_seats
      FROM {{table}}
      WHERE {{window}} AND ticket_availability <> 'Crawdads' AND total_seats IS NOT NULL
    ) w
    WHERE prev_actual_total_seats IS NOT NULL
      AND total_seats <> actual_total_seats - prev_actual_total_seats

- id: XROW_MISSING_FIRST_RECORD
  name: mm_id's first capacity-establishing record is missing
  class: custom
  severity: critical
  status: active
  requires: [mm_id, total_seats, actual_total_seats, ticket_availability]
  detail_columns: [mm_id, seat_sum, actual_total_seats]
  message: "lifetime total_seats sum is 0 but the showtime has real capacity"
  note: >
    Added 2026-09-21 per request. total_seats is a delta column -- an
    mm_id's very first crawl is expected to log total_seats equal to the
    starting actual_total_seats (there's no previous row to diff against),
    then 0 on every later row unless capacity itself changes. If that
    first establishing row never got written, SUM(total_seats) over the
    mm_id's lifetime stays 0 forever even though the showtime plainly has
    real capacity (actual_total_seats > 0) -- this rule catches exactly
    that gap. Distinct from XROW_SEATING_TYPE_LIFETIME_SEATS, which checks
    the sum's sign against seating_type; this checks it against
    actual_total_seats directly, regardless of seating_type. Same
    Crawdads-exclusion and window-scoping convention as
    XROW_SEATING_TYPE_LIFETIME_SEATS -- mm_ids are narrowed to this run's
    --from/--to window first, then summed/maxed across their full
    lifetime.
  sql: |
    SELECT mm_id, seat_sum, actual_total_seats
    FROM (
      SELECT mm_id,
             SUM(total_seats) AS seat_sum,
             MAX(actual_total_seats) AS actual_total_seats
      FROM {{table}}
      WHERE ticket_availability <> 'Crawdads'
        AND mm_id IN (SELECT DISTINCT mm_id FROM {{table}} WHERE {{window}})
      GROUP BY mm_id
    ) g
    WHERE seat_sum = 0 AND actual_total_seats > 0

- id: XROW_SEATING_TYPE_LIFETIME_SEATS
  name: seating_type does not match the mm_id's lifetime actual_total_seats sum
  class: custom
  severity: critical
  status: active
  requires: [mm_id, actual_total_seats, seating_type, ticket_availability]
  detail_columns: [mm_id, seating_type, seat_sum]
  message: "seating type does not match the sign of the mm_id's lifetime actual_total_seats sum"
  note: >
    Added 2026-09-19, rescoped 2026-09-21 for the production timeout,
    switched from SUM(total_seats) to SUM(actual_total_seats) 2026-09-21
    per request. Finds the distinct mm_ids that fall in this run's
    --from/--to window (indexed on date_sh), then sums actual_total_seats
    for only those mm_ids across their whole lifetime -- excluding
    Crawdads correction rows, same convention as XROW_WRONG_AVAILABLE/
    RESERVED/CHECKERED/TOTAL_SEATS. sum == 0 is expected to be Non
    Reserved, sum > 0 is expected to be Reserved. Note: since
    actual_total_seats is itself never negative, this sum can also never
    be negative, so the seat_sum < 0 branch below is now unreachable in
    practice -- kept for symmetry with XROW_MISSING_FIRST_RECORD's
    total_seats-based logic and as a harmless safety net, not because
    it's expected to fire. Assumes seating_type is constant for a given
    mm_id (MAX() picks a representative value) -- a genuinely mixed mm_id
    is a different defect this rule doesn't diagnose.
  sql: |
    SELECT mm_id, seating_type, seat_sum
    FROM (
      SELECT mm_id,
             MAX(seating_type) AS seating_type,
             SUM(actual_total_seats) AS seat_sum
      FROM {{table}}
      WHERE ticket_availability <> 'Crawdads'
        AND mm_id IN (SELECT DISTINCT mm_id FROM {{table}} WHERE {{window}})
      GROUP BY mm_id
    ) g
    WHERE seat_sum IS NOT NULL
      AND (
        seat_sum < 0
        OR (seat_sum = 0 AND seating_type <> 'Non Reserved')
        OR (seat_sum > 0 AND seating_type <> 'Reserved')
      )

- id: XROW_DUP_MMID_NO_AUDITORIUM
  name: same showtime crawled under different mm_id (no auditorium reported)
  class: custom
  severity: high
  status: active
  requires: [theater_id, title, date_sh, time_sh, auditorium, mm_id, total_seats, ticket_availability]
  detail_columns: [theater_id, title, date_sh, time_sh, mm_id, seat_sum]
  message: "the same showtime appears to be crawled under more than one mm_id with matching capacity"
  note: >
    Rewritten 2026-09-19 per request, fixed 2026-09-21. Groups by theater,
    title, date and time only (no auditorium reported, e.g. AMC-style
    theaters), then treats two different mm_ids in that group as the same
    real auditorium -- and therefore a duplicate showtime -- only when
    their lifetime SUM(total_seats) (Crawdads excluded) matches exactly.
    Distinct from XROW_DUP_MMID_WITH_AUDITORIUM, which groups directly by
    the reported auditorium value instead of by a capacity signature.
    Two production fixes on 2026-09-21: (1) MySQL rejects
    COUNT(DISTINCT ...) OVER (...) outright (error 1235) -- dropped
    DISTINCT since the row source is already one row per mm_id by
    construction (the inner GROUP BY mm_id), so plain COUNT(mm_id) OVER
    (...) is identical. (2) the inner aggregate had no date filter at all
    and grouped by mm_id over the ENTIRE table, which timed out
    (MAX_EXECUTION_TIME exceeded) -- rescoped the same way as
    XROW_SEATING_TYPE_LIFETIME_SEATS: first find the distinct mm_ids in
    this run's --from/--to window (indexed on date_sh), then sum
    total_seats for only those mm_ids across their full lifetime.
  sql: |
    SELECT theater_id, title, date_sh, time_sh, mm_id, seat_sum
    FROM (
      SELECT theater_id, title, date_sh, time_sh, mm_id, seat_sum,
             COUNT(mm_id) OVER (
               PARTITION BY theater_id, title, date_sh, time_sh, seat_sum
             ) AS sig_count
      FROM (
        SELECT mm_id,
               MAX(theater_id) AS theater_id, MAX(title) AS title,
               MAX(date_sh) AS date_sh, MAX(time_sh) AS time_sh,
               SUM(total_seats) AS seat_sum
        FROM {{table}}
        WHERE (auditorium IS NULL OR auditorium = '' OR auditorium = 'null')
          AND ticket_availability <> 'Crawdads'
          AND mm_id IN (SELECT DISTINCT mm_id FROM {{table}} WHERE {{window}})
        GROUP BY mm_id
      ) p
      WHERE seat_sum IS NOT NULL
    ) w
    WHERE sig_count > 1

- id: XROW_DUP_MMID_WITH_AUDITORIUM
  name: same showtime crawled under different mm_id (auditorium reported)
  class: cross_row
  severity: high
  status: active
  requires: [theater_id, title, date_sh, time_sh, auditorium, mm_id]
  group_by: [theater_id, title, date_sh, time_sh, auditorium]
  filter: "NOT (auditorium IS NULL OR auditorium = '' OR auditorium = 'null')"
  having: "COUNT(DISTINCT mm_id) > 1"
  detail_columns: [theater_id, title, date_sh, time_sh, auditorium, mm_id]
  message: "the same showtime appears to be crawled under more than one mm_id"
  note: >
    Rewritten 2026-09-19 per request to the simplest definition: same
    theater, title, date, time and reported auditorium under more than one
    mm_id is a duplicate showtime. Deliberately drops the previous
    version's screen_format/movie_format grouping columns and its D-Box /
    total_seats / running_date exclusions -- no extra conditions, per
    request.

- id: XROW_CRAWL_GAP
  name: showtime missing a day in its crawl series
  class: custom
  severity: low
  status: dormant
  requires: [mm_id, running_date]
  detail_columns: [mm_id, first_seen, last_seen, days_present, days_expected]
  message: "showtime was not crawled every day between first and last sighting"
  note: "Disabled 2026-09-17 per request -- low value, may be normal depending on how the crawl is scheduled."
  sql: |
    SELECT mm_id,
           MIN(running_date) AS first_seen, MAX(running_date) AS last_seen,
           COUNT(DISTINCT running_date) AS days_present,
           DATEDIFF(MAX(running_date), MIN(running_date)) + 1 AS days_expected
    FROM {{table}}
    WHERE {{window}}
    GROUP BY mm_id
    HAVING COUNT(DISTINCT running_date) < DATEDIFF(MAX(running_date), MIN(running_date)) + 1

- id: XTAB_THEATER_MASTER
  name: theater fields disagree with mqproduction.theater
  class: cross_table
  severity: high
  status: active
  requires: [theater_id, theater_name, theater_city, theater_state]
  detail_columns: [theater_id, theater_name, theater_city, theater_state]
  message: "theater details do not match the master record"
  note: >
    Join confirmed: CAST(theater_id AS UNSIGNED) = mqproduction.theater.theater_id
    (98.8% resolve rate, verified against real data). Deliberately excludes dma:
    movies_shows.dma and theater.theater_market disagree on ~1% of rows, but most
    of that is a naming-convention difference (a city-level dma vs. a broader
    market name for the same theater, e.g. "Lafayette IN" vs "Indianapolis"), not
    a real defect -- comparing it here would produce more noise than signal.
  sql: |
    SELECT ms.mm_id, ms.date_sh, ms.running_date, ms.theater_id,
           ms.theater_name AS ms_theater_name, t.theater_name AS master_theater_name,
           ms.theater_city AS ms_theater_city, t.theater_city AS master_theater_city,
           ms.theater_state AS ms_theater_state, t.theater_state AS master_theater_state
    FROM {{table}} ms
    JOIN mqproduction.theater t ON CAST(ms.theater_id AS UNSIGNED) = t.theater_id
    WHERE {{window}}
      AND (ms.theater_name <> t.theater_name
           OR ms.theater_city <> t.theater_city
           OR ms.theater_state <> t.theater_state)

- id: XTAB_CIRCUIT_NAME
  name: circuit_name disagrees with mqproduction.theater_circuit
  class: cross_table
  severity: medium
  status: active
  requires: [theater_id, circuit_name]
  detail_columns: [theater_id, circuit_name]
  message: "circuit does not match the circuit master"
  note: >
    Join confirmed via the FK path: theater_id -> mqproduction.theater.circuit_id
    -> mqproduction.theater_circuit.circuit_id (98.7% resolve rate). NOT a direct
    string match against movies_shows.circuit_name -- that field is unreliable on
    its own (verified: 60/1380 rows in a 1-day sample hold a theater name or junk
    like "IMAX" instead of an actual circuit), which is exactly what this rule
    now catches.
  sql: |
    SELECT ms.mm_id, ms.date_sh, ms.running_date, ms.theater_id,
           ms.circuit_name AS ms_circuit_name, tc.circuit_name AS master_circuit_name
    FROM {{table}} ms
    JOIN mqproduction.theater t ON CAST(ms.theater_id AS UNSIGNED) = t.theater_id
    JOIN mqproduction.theater_circuit tc ON t.circuit_id = tc.circuit_id
    WHERE {{window}}
      AND ms.circuit_name <> tc.circuit_name

- id: XTAB_MOVIE_MASTER
  name: title matched fq_movie_master but studio or release date disagrees
  class: cross_table
  severity: high
  status: active
  requires: [title, studio_name, release_date]
  detail_columns: [title, studio_name, release_date]
  message: "film details do not match the film master despite an exact title match"
  note: >
    Only fires for rows whose title DID join to fq_movie_master.movie_title --
    this is the real-corruption check. See XTAB_MOVIE_MASTER_COVERAGE for the
    separate, expected-to-fire, low-severity count of titles with no master
    match at all (sports/events/re-releases).
  sql: |
    SELECT ms.mm_id, ms.date_sh, ms.running_date, ms.title,
           ms.studio_name AS ms_studio_name, mm.studio_name AS master_studio_name,
           ms.release_date AS ms_release_date, mm.release_date AS master_release_date
    FROM {{table}} ms
    JOIN mqproduction.fq_movie_master mm ON ms.title = mm.movie_title
    WHERE {{window}}
      AND (
        COALESCE(ms.studio_name, '') <> COALESCE(mm.studio_name, '')
        OR COALESCE(
             DATE(CASE WHEN CAST(ms.release_date AS CHAR) LIKE '0000-00-00%' THEN NULL ELSE ms.release_date END), '1900-01-01'
           ) <> COALESCE(
             DATE(CASE WHEN CAST(mm.release_date AS CHAR) LIKE '0000-00-00%' THEN NULL ELSE mm.release_date END), '1900-01-01'
           )
      )

- id: XTAB_MOVIE_MASTER_COVERAGE
  name: title has no fq_movie_master match at all
  class: cross_table
  severity: low
  status: active
  requires: [title]
  detail_columns: [title]
  message: "title did not match any fq_movie_master record by exact string join"
  note: >
    Expected to fire on a meaningful share of rows -- verified 27% of distinct
    titles in a 1-day sample had no exact movie_title match, almost entirely
    sports broadcasts, special/private events, and re-release title variants
    (e.g. "The Passion of the Christ (2026)"), not data defects. Informational
    coverage count, not a hard finding -- see XTAB_MOVIE_MASTER for the
    higher-severity check on rows that DID match but disagree on studio/release.
  sql: |
    SELECT ms.mm_id, ms.date_sh, ms.running_date, ms.title
    FROM {{table}} ms
    LEFT JOIN mqproduction.fq_movie_master mm ON ms.title = mm.movie_title
    WHERE {{window}} AND mm.movie_title IS NULL
