- id: DOM_DMA
  name: dma not in the canonical market list
  class: domain
  severity: medium
  status: dormant
  blocked_by: Q16
  requires: [dma]
  allowed: []
  column: dma
  detail_columns: [dma, theater_city, theater_state]
